services:
  signaling:
    build:
      context: ../server
    image: remoteassist-signaling:${REMOTEASSIST_VERSION:-local}
    restart: unless-stopped
    environment:
      SIGNALING_ADDR: ":8080"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL}"
      SESSION_CODE_TTL: "${SESSION_CODE_TTL:-5m}"
      WS_MAX_MESSAGE_BYTES: "${WS_MAX_MESSAGE_BYTES:-65536}"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-120}"
      TURN_URLS: "${TURN_URLS}"
      TURN_USERNAME: "${TURN_USERNAME}"
      TURN_PASSWORD: "${TURN_PASSWORD}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  coturn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    command:
      - "-n"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--realm=${TURN_REALM}"
      - "--user=${TURN_USERNAME}:${TURN_PASSWORD}"
      - "--external-ip=${TURN_EXTERNAL_IP}"
      - "--listening-port=3478"
      - "--tls-listening-port=5349"
      - "--min-port=${TURN_MIN_PORT:-49152}"
      - "--max-port=${TURN_MAX_PORT:-49200}"
      - "--no-cli"
      - "--no-tlsv1"
      - "--no-tlsv1_1"
      - "--log-file=stdout"
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "${TURN_MIN_PORT:-49152}-${TURN_MAX_PORT:-49200}:${TURN_MIN_PORT:-49152}-${TURN_MAX_PORT:-49200}/udp"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      signaling:
        condition: service_healthy
    environment:
      PUBLIC_DOMAIN: "${PUBLIC_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
