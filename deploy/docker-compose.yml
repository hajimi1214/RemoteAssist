services:
  postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 5s
      retries: 5

  signaling:
    build:
      context: ../server
    image: remoteassist-signaling:${REMOTEASSIST_VERSION:-local}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    environment:
      SIGNALING_ADDR: ":8080"
      DATABASE_URL: "${DATABASE_URL}"
      JWT_SECRET: "${JWT_SECRET}"
      REFRESH_TOKEN_SECRET: "${REFRESH_TOKEN_SECRET}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL}"
      SESSION_CODE_TTL: "${SESSION_CODE_TTL:-5m}"
      SESSION_ACTIVE_TTL: "${SESSION_ACTIVE_TTL:-8h}"
      WS_MAX_MESSAGE_BYTES: "${WS_MAX_MESSAGE_BYTES:-65536}"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-120}"
      LOGIN_FAIL_LIMIT_PER_MINUTE: "${LOGIN_FAIL_LIMIT_PER_MINUTE:-10}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}"
      APP_ORIGINS: "${APP_ORIGINS:-http://tauri.localhost,https://tauri.localhost,tauri://localhost}"
      TURN_URLS: "${TURN_URLS}"
      TURN_SECRET: "${TURN_SECRET}"
      TURN_CREDENTIAL_TTL: "${TURN_CREDENTIAL_TTL:-10m}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  coturn:
    image: coturn/coturn:4.6.3@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888
    restart: unless-stopped
    command:
      - "-n"
      - "--fingerprint"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET}"
      - "--realm=${TURN_REALM}"
      - "--listening-ip=${TURN_RELAY_IP:-172.30.218.2}"
      - "--relay-ip=${TURN_RELAY_IP:-172.30.218.2}"
      - "--external-ip=${TURN_EXTERNAL_IP}/${TURN_RELAY_IP:-172.30.218.2}"
      - "--listening-port=3478"
      - "--min-port=${TURN_MIN_PORT:-49152}"
      - "--max-port=${TURN_MAX_PORT:-49200}"
      - "--no-cli"
      - "--no-tls"
      - "--no-dtls"
      - "--no-tcp-relay"
      - "--no-multicast-peers"
      - "--denied-peer-ip=0.0.0.0-0.255.255.255"
      - "--denied-peer-ip=10.0.0.0-10.255.255.255"
      - "--denied-peer-ip=100.64.0.0-100.127.255.255"
      - "--denied-peer-ip=127.0.0.0-127.255.255.255"
      - "--denied-peer-ip=169.254.0.0-169.254.255.255"
      - "--denied-peer-ip=172.16.0.0-172.31.255.255"
      - "--denied-peer-ip=192.168.0.0-192.168.255.255"
      - "--log-file=stdout"
    networks:
      turn:
        ipv4_address: "${TURN_RELAY_IP:-172.30.218.2}"
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "${TURN_MIN_PORT:-49152}-${TURN_MAX_PORT:-49200}:${TURN_MIN_PORT:-49152}-${TURN_MAX_PORT:-49200}/udp"

  caddy:
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    restart: unless-stopped
    depends_on:
      signaling:
        condition: service_healthy
    environment:
      PUBLIC_DOMAIN: "${PUBLIC_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  turn:
    driver: bridge
    ipam:
      config:
        - subnet: "${TURN_RELAY_SUBNET:-172.30.218.0/28}"
