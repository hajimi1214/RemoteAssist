[package]
name = "remoteassist"
version = "0.13.0-alpha"
description = "Visible Windows remote assistance client"
edition = "2021"

[lib]
name = "remoteassist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.7", features = [] }
thiserror = "2.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Security_Credentials", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
